services:
  loki:
    image: grafana/loki:main-7bfb71d
    container_name: loki
    restart: unless-stopped
    ports:
      - 3100:3100
      - 7946
      - 9095
  silo:
    image: pgsty/silo:distroless
    container_name: silo
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - 9000:9000 # S3 API
      - 9001:9001 # Web Console
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    volumes:
      - silo-data:/data

  tempo:
    image: grafana/tempo:r268-049347c-2099-1
    container_name: tempo
    restart: unless-stopped
    expose:
      - 3200
      - 4317
      - 4318
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml

  mimir:
    image: grafana/mimir:r410-1bbffa50
    container_name: mimir
    restart: unless-stopped
    ports:
      - 9008:9008
      - 9009:9009
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./config/mimir/mimir.yaml:/etc/mimir.yaml

  prometheus:
    image: prom/prometheus:v3.15.0-busybox
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    command:
      [
        "--web.enable-remote-write-receiver",
        "--config.file=/etc/prometheus/prometheus.yaml",
      ]
    volumes:
      - ./config/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_SECURITY_ALLOW_EMBEDDING=${GF_SECURITY_ALLOW_EMBEDDING:-true}
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
      prometheus:
        condition: service_started

  otel:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel
    restart: unless-stopped
    ports:
      - 4317:4317 # gRpc
      - 4318:4318 # Http
      - 8888:8888 # prometheus-collector
      - 1888:1888 # pprof
      - 13133:13133 # health check
      - 55679:55679 # zpages
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel/otel.yaml:/etc/otelcol/config.yaml
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
      grafana:
        condition: service_started

volumes:
  silo-data:
